apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-postgres
  namespace: ai-qa
  labels:
    app: auth-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-postgres
  template:
    metadata:
      labels:
        app: auth-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: authdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
          volumeMounts:
            - name: auth-postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: auth-postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-postgres
  namespace: ai-qa
spec:
  selector:
    app: auth-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
