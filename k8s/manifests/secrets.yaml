apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: ai-qa
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password@auth-postgres:5432/authdb"
  SECRET_KEY: "change-me-in-production"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: qa-service-secrets
  namespace: ai-qa
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password@qa-postgres:5432/qadb"
  SECRET_KEY: "change-me-in-production"
  ALGORITHM: "HS256"
  GROQ_API_KEY: "your-groq-api-key-here"
  REDIS_URL: "redis://redis:6379"
