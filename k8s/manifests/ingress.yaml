apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-qa-ingress
  namespace: ai-qa
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-qa.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8001
          - path: /qa
            pathType: Prefix
            backend:
              service:
                name: qa-service
                port:
                  number: 8000
